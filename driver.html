<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#9E1B1B"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="الطيار"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="rr-drv-apple.png">
<title>🛵 صفحة الطيار</title>
<script>
/* تثبيت كتطبيق: الـ manifest بيتبني من الرابط نفسه (بالكود والتوكن) فالتطبيق يفتح على صفحة الطيار مباشرة */
(function(){try{var B=location.origin+location.pathname,I=function(n){return new URL(n,location.href).href};var m={name:'ريد روستر — الطيار',short_name:'الطيار',lang:'ar',dir:'rtl',start_url:location.href.split('#')[0],scope:B,display:'standalone',background_color:'#f6f1ee',theme_color:'#9E1B1B',icons:[{src:I('rr-drv-192.png'),sizes:'192x192',type:'image/png'},{src:I('rr-drv-512.png'),sizes:'512x512',type:'image/png'},{src:I('rr-drv-maskable.png'),sizes:'512x512',type:'image/png',purpose:'maskable'}]};var l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);}catch(e){}})();
</script>
<style>
:root{--r:#9E1B1B;--bg:#f6f1ee;--c:#fff;--t:#222;--m:#7a6f68;--ok:#0B6E4F}
@media(prefers-color-scheme:dark){:root{--bg:#161212;--c:#221b1b;--t:#f3ece8;--m:#a99d96}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:600 16px/1.6 Cairo,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--r);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:5}
header b{font-size:1.05rem}header span{font-size:.85rem;opacity:.95}
main{padding:12px;max-width:560px;margin:auto}
.card{background:var(--c);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.card h3{margin:0 0 4px;font-size:1.02rem;display:flex;justify-content:space-between;gap:8px}.card small{color:var(--m)}
.row{margin:6px 0}.it{font-size:.9rem;color:var(--m)}
.pay{padding:8px 10px;border-radius:10px;background:#FFF6E5;font-weight:800;margin:8px 0}.pay.ok{background:#E3F6EC;color:var(--ok)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btns a,.btns button{flex:1;min-width:90px;text-align:center;padding:12px 8px;border-radius:12px;border:0;font:800 .95rem Cairo,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.nav{background:#1d3f8f;color:#fff}.call{background:#e8eefc;color:#1d3f8f}.done{background:var(--r);color:#fff}.done:disabled{opacity:.6}
.empty{text-align:center;color:var(--m);padding:40px 10px}.msg{text-align:center;color:var(--m);font-size:.8rem;padding:6px}
.trk{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--c);border-radius:14px;padding:10px 12px;margin:0 0 4px;box-shadow:0 1px 6px rgba(0,0,0,.08);font-size:.88rem}
.trk button{flex:0 0 auto;border:0;border-radius:10px;padding:8px 14px;font:800 .9rem Cairo,system-ui,sans-serif;background:#1d3f8f;color:#fff;cursor:pointer}.trk button.on{background:#e8eefc;color:#1d3f8f}
.trkh{font-size:.76rem;color:var(--m);margin:0 4px 12px}
.owe{background:#FFF6E5;color:#7A5800;border-radius:14px;padding:10px 12px;margin:0 0 12px;font-weight:800;font-size:.92rem}
.pwab{border:0;border-radius:12px;padding:10px 14px;font:800 .9rem Cairo,system-ui,sans-serif;background:var(--r);color:#fff;cursor:pointer;margin:8px 0}
.hide{display:none!important}
</style>
</head>
<body>
<header><b id="hn">🛵 صفحة الطيار</b><span id="sum"></span></header>
<main>
<div class="trk"><span id="trkS">📍 مشاركة موقعك: متوقفة</span><button id="trkB" type="button">شغّل</button></div>
<div class="trkh">💡 المتصفح بيوقف الموقع أول ما الصفحة تنزل الخلفية أو الشاشة تتقفل. عشان العميل يشوف مكانك طول الطريق: سيب الصفحة مفتوحة والشاشة شغّالة (مش هتنطفي لوحدها)، واستخدم تطبيق OwnTracks لو عايز الموقع يفضل شغّال والموبايل مقفول.</div>
<div class="owe hide" id="owe"></div>
<div id="list"><div class="empty">⏳ بنحمّل طلباتك...</div></div><div class="msg" id="msg"></div>
<div class="msg"><button class="pwab hide" id="pwaBtn" type="button">📲 ثبّت التطبيق على الموبايل</button></div>
</main>
<script>
const API='https://script.google.com/macros/s/AKfycbzoNNPfliuE1Cp87iylF0GtJGxrYSMRfnatHjIBHefLAwIzvv8T4BQzKfFYp_G2OALr/exec',Q=new URLSearchParams(location.search);
let D=Q.get('d')||'',T=Q.get('t')||'';
try{if(D&&T){localStorage.setItem('rr_d',D);localStorage.setItem('rr_t',T)}else{D=localStorage.getItem('rr_d')||'';T=localStorage.getItem('rr_t')||''}}catch(e){}   // لو التطبيق اتفتح من غير الرابط الكامل نستخدم آخر رابط اتفتح
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let busy=false,lastN=-1,curN=0;
const ago=t=>{const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'دلوقتي':m<60?'من '+m+' د':'من '+Math.floor(m/60)+' س '+(m%60)+' د'};
const sl=t=>{const k=x=>new Date(x).toDateString();return (k(t)===k(Date.now())?'النهاردة':k(t)===k(Date.now()+864e5)?'بكرة':new Date(t).toLocaleDateString('ar-EG',{day:'numeric',month:'short'}))+' '+new Date(t).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})};
function nav(o){return o.lat!=null?'https://www.google.com/maps/dir/?api=1&destination='+o.lat+','+o.lon+'&travelmode=driving':'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((o.address||'')+' '+(o.area||''))}
function card(o){
  const items=(o.items||[]).map(i=>esc(i.q+'× '+i.n)).join('، ');
  const pay=o.payment==='cash'?'<div class="pay">💵 كاش — حصّل <b>'+o.total+' ج.م</b></div>':o.paid?'<div class="pay ok">✅ مدفوع (تحويل) — مفيش تحصيل</div>':'<div class="pay">⏳ التحويل لسه متأكدش — كلّم الفرع قبل التسليم</div>';
  return '<div class="card"'+(o.sched?' style="border:2px solid #7C3AED"':'')+'><h3><span>#'+esc(o.id)+' · '+esc(o.name)+'</span><small>'+ago(o.time)+'</small></h3>'+
    (o.sched?'<div class="pay" style="background:#EDE5FF;color:#4C1D95">⏰ ميعاد التسليم: '+sl(o.sched)+'</div>':'')+'<div class="row">📍 '+esc(o.address)+(o.area?' ('+esc(o.area)+')':'')+'</div>'+
    '<div class="row it">🧾 '+items+'</div>'+(o.notes?'<div class="row it">📝 '+esc(o.notes)+'</div>':'')+pay+
    '<div class="btns"><a class="nav" target="_blank" rel="noopener" href="'+nav(o)+'">🧭 ملاحة</a><a class="call" href="tel:'+esc(o.phone)+'">📞 اتصال</a>'+
    '<button class="done" data-id="'+esc(o.id)+'">✅ تم التسليم</button></div></div>';
}
async function load(){
  if(!D||!T){$('list').innerHTML='<div class="empty">⚠️ الرابط ناقص — اطلب الرابط الصحيح من المطعم.</div>';return}
  try{
    const r=await fetch(API+'?action=drvorders&d='+encodeURIComponent(D)+'&t='+encodeURIComponent(T)),j=await r.json();
    if(!j.ok){$('list').innerHTML='<div class="empty">⛔ الرابط غير صالح أو اتغيّر — اطلب رابط جديد من المطعم.</div>';return}
    $('hn').textContent='🛵 '+j.name;document.title='🛵 '+j.name+(j.orders.length?' ('+j.orders.length+')':'');
    $('sum').textContent='اتسلّم النهاردة: '+j.today.n+' · كاش: '+j.today.cash+' ج';
    const ow=j.owed||{n:0,amt:0};$('owe').innerHTML=ow.n?'💵 كاش معاك لسه ماتسلّمش للمطعم: <b>'+ow.amt+' ج</b> ('+ow.n+' طلب) — سلّمه للفرع واطلب التسوية':'';$('owe').classList.toggle('hide',!ow.n);
    $('list').innerHTML=j.orders.length?j.orders.map(card).join(''):'<div class="empty">مفيش طلبات معاك دلوقتي 🙌</div>';
    if(lastN>=0&&j.orders.length>lastN&&navigator.vibrate)navigator.vibrate([200,100,200]);lastN=j.orders.length;curN=j.orders.length;
    $('msg').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
    trkSend();trkPaint();
  }catch(e){$('msg').textContent='⚠️ مفيش اتصال — هنحاول تاني'}
}
$('list').addEventListener('click',async e=>{
  const b=e.target.closest('.done');if(!b||busy)return;
  if(!confirm('تأكيد تسليم الطلب #'+b.dataset.id+'؟'))return;
  busy=true;b.disabled=true;b.textContent='⏳...';
  try{const r=await fetch(API,{method:'POST',body:JSON.stringify({action:'drvDeliver',d:D,t:T,id:b.dataset.id})}),j=await r.json();
    if(!j.ok)alert('⚠️ مقدرناش نسجّل التسليم'+(j.error==='forbidden'?' (الطلب مش على حسابك أو اتسلّم)':'')+' — جرّب تاني');
  }catch(x){alert('⚠️ مفيش اتصال — جرّب تاني')}
  busy=false;load();
});

/* ═══ مشاركة موقع الطيار (بديل/مكمّل لتطبيق OwnTracks): بتتبعت بس لما يكون معاك طلبات في الطريق ═══ */
const TS={on:false,w:null,pos:null,sent:0,sentTry:0,wl:null,err:''};
function trkPaint(){
  const s=$('trkS'),b=$('trkB');
  if(!TS.on){s.textContent='📍 مشاركة موقعك: متوقفة';b.textContent='شغّل';b.className='';return}
  b.textContent='إيقاف';b.className='on';
  if(TS.err){s.textContent='⚠️ '+TS.err;return}
  if(!TS.pos){s.textContent='📡 بندوّر على الـ GPS...';return}
  if(!curN){s.textContent='🟢 الموقع شغّال — مش بنبعته لأن مفيش طلبات معاك';return}
  s.textContent=TS.sent?'🟢 موقعك بيوصل للعميل (آخر إرسال من '+Math.round((Date.now()-TS.sent)/1000)+' ث)':'🟡 جاري إرسال موقعك...';
}
async function trkWake(){try{if(TS.on&&'wakeLock' in navigator&&!TS.wl){TS.wl=await navigator.wakeLock.request('screen');TS.wl.addEventListener('release',()=>{TS.wl=null})}}catch(e){}}
function trkStart(){
  if(!navigator.geolocation){TS.on=true;TS.err='الجهاز مش بيدعم تحديد الموقع';trkPaint();return}
  TS.on=true;TS.err='';try{localStorage.setItem('rr_share','1')}catch(e){}
  if(TS.w!=null)navigator.geolocation.clearWatch(TS.w);
  TS.w=navigator.geolocation.watchPosition(p=>{TS.err='';TS.pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,v:p.coords.speed||0};trkSend();trkPaint()},
    e=>{TS.err=e.code===1?'الموقع مش مسموح — فعّله من إعدادات المتصفح ثم دوس «شغّل»':'تعذّر تحديد موقعك — اتأكد إن الـ GPS شغّال';trkPaint()},{enableHighAccuracy:true,maximumAge:5000,timeout:25000});
  trkWake();trkPaint();
}
function trkStop(){TS.on=false;if(TS.w!=null&&navigator.geolocation)navigator.geolocation.clearWatch(TS.w);TS.w=null;TS.pos=null;TS.sent=0;try{localStorage.removeItem('rr_share')}catch(e){}if(TS.wl){TS.wl.release().catch(()=>{});TS.wl=null}trkPaint()}
async function trkSend(force){
  if(!TS.on||!TS.pos||!curN||(!force&&Date.now()-TS.sentTry<20000))return;TS.sentTry=Date.now();
  try{const r=await fetch(API,{method:'POST',keepalive:true,body:JSON.stringify({action:'drvPos',d:D,t:T,lat:TS.pos.lat,lon:TS.pos.lon,acc:TS.pos.acc,vel:TS.pos.v})}),j=await r.json();if(j&&j.ok)TS.sent=Date.now()}catch(e){}
  trkPaint();
}
$('trkB').addEventListener('click',()=>TS.on?trkStop():trkStart());
setInterval(()=>{trkSend();trkPaint()},10000);
try{if(localStorage.getItem('rr_share')==='1')trkStart()}catch(e){}

load();setInterval(()=>{if(!document.hidden)load()},20000);

/* لما الصفحة تنزل الخلفية المتصفح بيوقف الـ GPS — نبعت آخر موقع قبلها، ولما يرجع ننبّه الطيار إن الموقع كان واقف ونعيد تشغيل التتبّع */
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();trkSend(true)}
  else{
    load();trkWake();
    if(TS.on&&curN&&hiddenAt&&Date.now()-hiddenAt>30000){
      const m=Math.round((Date.now()-hiddenAt)/60000);
      $('trkS').textContent='⚠️ الموقع كان واقف '+(m<1?'شوية':m+' د')+' لأن الصفحة كانت في الخلفية — العميل ماكانش شايف مكانك';
      setTimeout(trkPaint,8000);
    }
    hiddenAt=0;
    if(TS.on)trkStart();
  }
});
addEventListener('pagehide',()=>trkSend(true));

/* ═══ تثبيت كتطبيق (PWA) ═══ */
(function(){
  const pb=$('pwaBtn');let dip=null;const st=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(!st())pb.classList.remove('hide')});
  addEventListener('appinstalled',()=>{pb.classList.add('hide');dip=null});
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!st())pb.classList.remove('hide');
  pb.addEventListener('click',()=>{if(dip){dip.prompt();dip.userChoice.then(()=>{dip=null;pb.classList.add('hide')}).catch(()=>{})}else alert('آيفون: دوس زر المشاركة ⬆️ ثم «إضافة إلى الشاشة الرئيسية».\nأندرويد: من قايمة المتصفح ⋮ اختار «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».')});
  if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('staff-sw.js',{scope:location.pathname}).catch(()=>{})});
})();
</script>
</body>
</html>
